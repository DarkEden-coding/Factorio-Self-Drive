# Pathfinder-route map student fine-tuned to stop in the middle of the target, like
# student_mlp64_stop.toml. Start it from the pathfinder student's PPO run:
#   fsim-rl train --config configs/student_map_path_stop.toml \
#     --init-from runs/students/path-rl/checkpoints/latest.pt --run-name students/path-stop
# This is the model the Factorio mod ships (docs/autodrive-mod.md).
base = "student_map_path.toml"

[env]
scenarios = [
    { kind = "arrival", weight = 0.5 },
    { kind = "standard", weight = 0.15 },
    { kind = "long", weight = 0.025 },
    { kind = "forest", weight = 0.15 },
    { kind = "reverse", weight = 0.1 },
    { kind = "nest", weight = 0.075 },
]

[env.arrival]
mode = "stop"
stop_radius = 1.0
stop_speed = 0.01

[env.reward]
arrival = 2.0
target_speed = -1.0

[ppo]
num_envs = 256
total_steps = 8_000_000
learning_rate = 1e-4
