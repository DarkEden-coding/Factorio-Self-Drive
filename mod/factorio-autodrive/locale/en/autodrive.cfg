[item-name]
factorio-autodrive-target=Autodrive target
[item-description]
factorio-autodrive-target=Click or select a target in the world or on the map (explored chunks) while driving a car or tank.
[shortcut-name]
factorio-autodrive-target=Set autodrive target
[controls]
factorio-autodrive-tool=Get autodrive target tool
factorio-autodrive-resume=Resume autodrive
[mod-setting-name]
factorio-autodrive-overlay=Show autodrive diagnostic lines
factorio-autodrive-avoid-rails=Avoid train tracks
factorio-autodrive-profile=Write autodrive Lua timings
[mod-setting-description]
factorio-autodrive-overlay=Draw the target, verified route, coarse path and four lookahead points in the world and on the map. Disabled by default.
factorio-autodrive-avoid-rails=Route around ground-level train tracks where a nearby detour exists, and cross them only when needed. Applies to the next target you set. Disabled by default.
factorio-autodrive-profile=Write local LuaProfiler timings to script-output/factorio-autodrive/timing.txt. Decision interval is always 4 ticks.
